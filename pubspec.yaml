name: carnet_chantier
description: "Chantier Connect : notes libres, suivi de chantier, ouvriers et stock."
publish_to: 'none'
version: 0.5.0+5

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.4.1
  path: ^1.9.0
  intl: any
  path_provider: ^2.1.5
  image_picker: ^1.1.2
  pdf: ^3.11.3
  share_plus: '>=11.0.0 <14.0.0'
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.4

flutter:
  uses-material-design: true
  assets:
    - assets/logo/icon.png
